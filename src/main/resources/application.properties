spring.application.name=aegis
# if no profile is set, run as 'dev'
spring.profiles.default=dev

# Our own type-safe config namespace (bound to AppProperties)
aegis.correlation.header-name=X-Correlation-Id

management.endpoints.web.exposure.include=health,info,metrics

# Don't hold DB connections open for the lifetime of a web request (the "Open
# Session in View" anti-pattern) — every query should happen inside the
# @Transactional service method, not lazily while a view renders.
spring.jpa.open-in-view=false
