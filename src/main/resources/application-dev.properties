server.port=8081

# full component breakdown locally
management.endpoint.health.show-details=always

# verbose for our own code
logging.level.com.sapiens.aegis=DEBUG

# Real PostgreSQL now (see docker run --name aegis-postgres ... postgres:16).
# Data persists across app restarts (in the container) but resets if the
# container itself is removed/recreated.
spring.datasource.url=jdbc:postgresql://localhost:5432/aegis
spring.datasource.username=postgres
spring.datasource.password=aegis

# Schema is now owned by Flyway (see src/main/resources/db/migration).
# Hibernate only validates its entity mapping against what Flyway created —
# it never creates or alters a table itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
