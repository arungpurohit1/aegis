server.port=8080

# don't leak internals publicly
management.endpoint.health.show-details=when_authorized

logging.level.root=WARN
logging.level.com.sapiens.aegis=INFO

# TEMPORARY: file-based H2 until a real PostgreSQL instance is provisioned.
# Swapping in Postgres later is a url/driver/credentials change only — no
# entity or repository code depends on which database is behind it.
spring.datasource.url=jdbc:h2:file:./data/aegis;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is now owned by Flyway (see src/main/resources/db/migration);
# Hibernate only validates, never creates or alters, here too.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
