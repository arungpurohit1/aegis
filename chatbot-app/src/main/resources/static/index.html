<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9098a8;
    --accent: #4f7cff;
    --user-bubble: #2a3a63;
    --bot-bubble: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; }
  header p { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
  }
  .msg.error {
    align-self: flex-start;
    background: #4a1f1f;
    color: #f3b3b3;
  }
  #input-row {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  #message-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  #message-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #error-banner {
    display: none;
    font-size: 13px;
    color: #f3b3b3;
    padding: 4px 24px;
  }
</style>
</head>
<body>
  <header>
    <h1>Local chatbot</h1>
    <p>Runs on your machine, talks to Azure OpenAI. Nothing is stored after you close this page.</p>
  </header>
  <div id="error-banner"></div>
  <div id="chat-log"></div>
  <div id="input-row">
    <input id="message-input" type="text" maxlength="4000" placeholder="Type a message..." autocomplete="off">
    <button id="send-btn">Send</button>
  </div>

<script>
  const chatLog = document.getElementById('chat-log');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const errorBanner = document.getElementById('error-banner');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    // Using textContent (never innerHTML) so nothing the model or user
    // types can be interpreted as HTML/script - prevents XSS.
    div.textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function showError(text) {
    errorBanner.textContent = text;
    errorBanner.style.display = 'block';
  }

  function clearError() {
    errorBanner.style.display = 'none';
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    if (text.length > 4000) {
      showError('Message is too long (max 4000 characters).');
      return;
    }
    clearError();
    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      if (!res.ok) {
        addMessage(data.reply || 'Something went wrong.', 'error');
      } else {
        addMessage(data.reply, 'bot');
      }
    } catch (err) {
      addMessage('Could not reach the server. Is it running?', 'error');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
